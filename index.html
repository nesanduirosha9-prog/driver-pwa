<!doctype html>
<html lang="si">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="manifest" href="manifest.json" />
    <title>Driver App</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body,
      html {
        height: 100%;
        font-family: "Noto Sans Sinhala", sans-serif;
        background-color: #000;
        overflow: hidden;
      }

      /* Map Background */
      #map-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #map-bg iframe {
        position: absolute;
        top: -60px;
        left: -20px;
        width: calc(100% + 40px);
        height: calc(100% + 120px);
        border: 0;
      }

      .map-pin {
        position: absolute;
        top: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: 24px;
        height: 24px;
        background-color: #000;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        z-index: 1;
      }
      .map-pin::after {
        content: "";
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 3px;
        height: 15px;
        background-color: #000;
      }

      /* Floating Cards */
      .card {
        position: fixed;
        bottom: 0;
        left: 2%;
        width: 96%;
        height: 75vh;
        background-color: #1e1e1e;
        color: #fff;
        border-top-left-radius: 30px;
        border-top-right-radius: 30px;
        padding: 24px;
        z-index: 10;
        display: none; /* Hidden by default */
        box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
        border: 1px solid #333;
        border-bottom: none;
        overflow-y: auto;
      }
      .active-screen {
        display: flex;
        flex-direction: column;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      p {
        font-size: 16px;
        color: #b3b3b3;
        margin-bottom: 15px;
        line-height: 1.4;
      }

      /* Form Input */
      .input-field {
        width: 100%;
        padding: 16px;
        font-size: 20px;
        background-color: #2a2a2a;
        border: 2px solid #444;
        color: white;
        border-radius: 12px;
        margin-bottom: 20px;
        outline: none;
        font-family: inherit;
      }
      .input-field:focus {
        border-color: #f8d174;
      }
      .primary-btn {
        width: 100%;
        padding: 16px;
        background-color: #f8d174;
        color: black;
        border: none;
        border-radius: 30px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }

      /* Numpad Styles */
      .numpad-display {
        font-size: 40px;
        font-weight: bold;
        text-align: right;
        padding: 20px;
        background: #2a2a2a;
        border-radius: 12px;
        margin-bottom: 20px;
        min-height: 80px;
      }
      .numpad-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        flex-grow: 1;
      }
      .num-btn {
        background-color: #333;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }
      .num-btn:active {
        background-color: #555;
      }
      .num-btn.ok-btn {
        background-color: #f8d174;
        color: black;
      }

      /* Payment Screen Styles */
      .amount-display {
        display: flex;
        align-items: baseline;
        margin-bottom: 15px;
      }
      #display-final-amount {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -1px;
      }
      .currency-label {
        font-size: 14px;
        font-weight: 600;
        color: #b3b3b3;
        margin-left: 8px;
      }

      .discount-btn {
        background-color: #383838;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        margin-bottom: 20px;
        font-weight: 600;
        font-size: 14px;
      }
      .discount-btn img {
        width: 18px;
        height: 18px;
        object-fit: contain;
      }

      /* Slider Button */
      .slider-container {
        width: 100%;
        height: 56px;
        background-color: #f8d174;
        border-radius: 30px;
        position: relative;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        touch-action: none;
        flex-shrink: 0;
      }
      .slider-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 56px;
        background-color: rgba(0, 0, 0, 0.15);
        border-radius: 30px;
        z-index: 1;
      }
      .slider-text {
        color: #000;
        font-size: 16px;
        font-weight: 700;
        z-index: 2;
        position: relative;
      }
      .slider-thumb {
        position: absolute;
        left: 5px;
        top: 5px;
        width: 46px;
        height: 46px;
        background-color: transparent;
        border-radius: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3;
        cursor: pointer;
        transition: transform 0.1s ease-out;
      }
      .slider-thumb img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      .qr-btn {
        width: 100%;
        padding: 14px;
        background-color: transparent;
        color: white;
        border: 2px solid #fff;
        border-radius: 30px;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .qr-btn img {
        width: 20px;
        height: 20px;
        object-fit: contain;
      }

      /* Footer */
      .footer-logos {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 10px;
        padding-bottom: 10px;
      }
      .footer-logos span {
        font-size: 15px;
        font-weight: bold;
        color: #fff;
        letter-spacing: 0.5px;
      }
      .logos {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .payment-logo {
        height: 46px;
        background: white;
        border-radius: 6px;
        padding: 4px;
        object-fit: contain;
      }

      /* Rating Screen */
      .feedback-box {
        border: 1px solid #444;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 20px;
      }
      .emojis {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
      }
      .emoji {
        font-size: 32px;
        opacity: 0.5;
        cursor: pointer;
        transition: all 0.2s;
        filter: grayscale(100%);
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }
      .emoji.selected {
        opacity: 1;
        background-color: rgba(255, 255, 255, 0.2);
      }
      .finish-btn {
        width: 100%;
        padding: 14px;
        background-color: transparent;
        color: white;
        border: 2px solid #fff;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 20px;
      }
      .report-issue {
        text-align: center;
        color: #fff;
        font-size: 14px;
        margin-top: auto;
        padding-bottom: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      #closed-state {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
        font-size: 20px;
      }

      @media (max-height: 650px), (max-width: 360px) {
        .card {
          padding: 16px;
          height: 80vh;
        }
        h1 {
          font-size: 20px;
        }
        p {
          font-size: 14px;
          margin-bottom: 10px;
        }
        #display-final-amount {
          font-size: 48px;
        }
        .slider-container {
          height: 50px;
          margin-bottom: 15px;
        }
        .slider-thumb {
          width: 40px;
          height: 40px;
        }
        .slider-thumb img {
          width: 28px;
          height: 28px;
        }
        .slider-fill {
          width: 50px;
        }
        .slider-text {
          font-size: 15px;
        }
        .qr-btn {
          padding: 12px;
          font-size: 14px;
        }
        .emoji {
          font-size: 28px;
          width: 44px;
          height: 44px;
        }
        .footer-logos span {
          font-size: 13px;
        }
        .payment-logo {
          height: 38px;
        }
      }
    </style>
  </head>
  <body>
    <div id="map-bg">
      <div class="map-pin"></div>
      <iframe
        id="gmap-iframe"
        src=""
        allowfullscreen=""
        loading="lazy"
      ></iframe>
    </div>

    <div id="screen-name" class="card">
      <h1>Rider Details</h1>
      <p>Enter the passenger's name to begin.</p>
      <input
        type="text"
        id="rider-name-input"
        class="input-field"
        placeholder="E.g. Andrew"
      />
      <button class="primary-btn" onclick="saveName()">Next ➔</button>
    </div>

    <div id="screen-numpad" class="card">
      <h1>Enter Amount</h1>
      <div class="numpad-display" id="entered-amount">0.00</div>
      <div class="numpad-grid">
        <button class="num-btn" onclick="appendNum(1)">1</button>
        <button class="num-btn" onclick="appendNum(2)">2</button>
        <button class="num-btn" onclick="appendNum(3)">3</button>
        <button class="num-btn" onclick="appendNum(4)">4</button>
        <button class="num-btn" onclick="appendNum(5)">5</button>
        <button class="num-btn" onclick="appendNum(6)">6</button>
        <button class="num-btn" onclick="appendNum(7)">7</button>
        <button class="num-btn" onclick="appendNum(8)">8</button>
        <button class="num-btn" onclick="appendNum(9)">9</button>
        <button class="num-btn" onclick="clearNum()">C</button>
        <button class="num-btn" onclick="appendNum(0)">0</button>
        <button class="num-btn ok-btn" onclick="submitAmount()">OK</button>
      </div>
    </div>

    <div id="screen-payment" class="card">
      <h1>මුදල් ලබාගන්න</h1>
      <p>
        <span class="dynamic-name">Passenger</span> ගෙන් මෙම මුදල එකතු කරන්න.
      </p>

      <div class="amount-display">
        <span id="display-final-amount">0.00</span>
        <span class="currency-label">LKR</span>
      </div>

      <button class="discount-btn">
        <img src="icons/discount.png" alt="Discount Icon" /> Discount
      </button>

      <div class="slider-container" id="slider-container">
        <div class="slider-fill" id="slider-fill"></div>
        <div class="slider-thumb" id="slider-thumb">
          <img src="icons/arrow.png" alt="Arrow" />
        </div>
        <div class="slider-text">ඉදිරියට</div>
      </div>

      <button class="qr-btn">
        <img src="icons/QR.png" alt="QR Icon" /> QR වලට මාරුවෙන්න
      </button>

      <div class="footer-logos">
        <span>WE SUPPORT</span>
        <div class="logos">
          <img src="icons/lankaQR.jpg" class="payment-logo" alt="LankaQR" />
          <img src="icons/upi.jpg" class="payment-logo" alt="UPI" />
        </div>
      </div>
    </div>

    <div id="screen-rating" class="card">
      <h1>චාරිකාව සම්පූර්ණයි!</h1>
      <div class="feedback-box">
        <p style="color: white; margin-bottom: 0">
          <span class="dynamic-name">Passenger</span> සමග ඔබේ අත්දැකීම ගැන අපට
          කියන්න.
        </p>
        <div class="emojis">
          <div class="emoji" onclick="selectRating(this)">😵</div>
          <div class="emoji" onclick="selectRating(this)">☹️</div>
          <div class="emoji" onclick="selectRating(this)">😐</div>
          <div class="emoji selected" onclick="selectRating(this)">😀</div>
          <div class="emoji" onclick="selectRating(this)">😁</div>
        </div>
      </div>
      <button class="finish-btn">✓ අවසන්</button>
      <div class="report-issue"><span>(!)</span> ගැටළුව දන්වන්න</div>
    </div>

    <div id="closed-state">App Closed</div>

    <script>
      // --- PWA Service Worker Registration ---
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .catch((err) => console.log("SW Reg Failed:", err));
        });
      }

      // --- Geolocation ---
      function updateMapLocation(lat, lon) {
        document.getElementById("gmap-iframe").src =
          `https://maps.google.com/maps?q=${lat},${lon}&z=16&output=embed&iwloc=near`;
      }
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => updateMapLocation(pos.coords.latitude, pos.coords.longitude),
          (err) => updateMapLocation(6.773, 79.8816), // Default Moratuwa
        );
      } else {
        updateMapLocation(6.773, 79.8816);
      }

      // --- App State & Persistence Logic ---
      const UI_SCREENS = [
        "screen-name",
        "screen-numpad",
        "screen-payment",
        "screen-rating",
      ];
      let currentAmountStr = "";

      // On Load: Check if we left off somewhere
      window.addEventListener("DOMContentLoaded", () => {
        const savedScreen = localStorage.getItem("appScreen") || "screen-name";
        const savedName = localStorage.getItem("riderName");
        const savedAmount = localStorage.getItem("rideAmount");

        if (savedName) updateDynamicNames(savedName);
        if (savedAmount) {
          document.getElementById("display-final-amount").innerText =
            savedAmount;
          currentAmountStr = savedAmount.replace(".00", "").replace(/,/g, ""); // reconstruct for numpad just in case
          updateDisplay();
        }

        if (savedScreen === "app-closed") {
          document.getElementById("map-bg").style.display = "none";
          document.getElementById("closed-state").style.display = "flex";
        } else {
          switchScreen(savedScreen);
        }
      });

      function switchScreen(screenId) {
        UI_SCREENS.forEach((id) =>
          document.getElementById(id).classList.remove("active-screen"),
        );
        document.getElementById(screenId).classList.add("active-screen");
        localStorage.setItem("appScreen", screenId);
      }

      function updateDynamicNames(name) {
        document
          .querySelectorAll(".dynamic-name")
          .forEach((el) => (el.innerText = name));
      }

      // Screen 0: Save Name
      function saveName() {
        const nameInput = document
          .getElementById("rider-name-input")
          .value.trim();
        if (!nameInput) return alert("Please enter a name");
        localStorage.setItem("riderName", nameInput);
        updateDynamicNames(nameInput);
        switchScreen("screen-numpad");
      }

      // Screen 1: Numpad
      function appendNum(num) {
        currentAmountStr += num;
        updateDisplay();
      }
      function clearNum() {
        currentAmountStr = "";
        updateDisplay();
      }
      function updateDisplay() {
        let val = currentAmountStr ? parseInt(currentAmountStr) : 0;
        document.getElementById("entered-amount").innerText =
          val.toLocaleString("en-US") + ".00";
      }
      function submitAmount() {
        if (!currentAmountStr) currentAmountStr = "0";
        let formattedAmount =
          parseInt(currentAmountStr).toLocaleString("en-US") + ".00";
        document.getElementById("display-final-amount").innerText =
          formattedAmount;

        localStorage.setItem("rideAmount", formattedAmount);
        switchScreen("screen-payment");

        // Fix slider setup when showing payment screen
        sliderFill.style.width = sliderThumb.offsetWidth + 10 + "px";
      }

      // Screen 2: Slider
      const sliderContainer = document.getElementById("slider-container");
      const sliderThumb = document.getElementById("slider-thumb");
      const sliderFill = document.getElementById("slider-fill");
      let isDragging = false,
        startX = 0,
        currentTranslate = 0;

      function getPos(e) {
        return e.type.includes("mouse") ? e.pageX : e.touches[0].clientX;
      }

      function sliderStart(e) {
        isDragging = true;
        startX = getPos(e) - currentTranslate;
        sliderThumb.style.transition = "none";
        sliderFill.style.transition = "none";
      }
      function sliderMove(e) {
        if (!isDragging) return;
        const currentX = getPos(e);
        let diff = currentX - startX;
        const maxDrag =
          sliderContainer.offsetWidth - sliderThumb.offsetWidth - 10;

        if (diff < 0) diff = 0;
        if (diff > maxDrag) diff = maxDrag;

        currentTranslate = diff;
        sliderThumb.style.transform = `translateX(${currentTranslate}px)`;
        sliderFill.style.width =
          currentTranslate + sliderThumb.offsetWidth + 5 + "px";

        if (diff > maxDrag * 0.85) {
          isDragging = false;
          switchScreen("screen-rating");
        }
      }
      function sliderEnd() {
        if (!isDragging) return;
        isDragging = false;
        sliderThumb.style.transition = "transform 0.3s ease-out";
        sliderFill.style.transition = "width 0.3s ease-out";
        currentTranslate = 0;
        sliderThumb.style.transform = `translateX(0px)`;
        sliderFill.style.width = sliderThumb.offsetWidth + 10 + "px";
      }

      sliderThumb.addEventListener("mousedown", sliderStart);
      sliderThumb.addEventListener("touchstart", sliderStart, {
        passive: true,
      });
      window.addEventListener("mousemove", sliderMove);
      window.addEventListener("touchmove", sliderMove, { passive: true });
      window.addEventListener("mouseup", sliderEnd);
      window.addEventListener("touchend", sliderEnd);

      // Screen 3: Rating (Completion)
      function selectRating(element) {
        document
          .querySelectorAll(".emoji")
          .forEach((el) => el.classList.remove("selected"));
        element.classList.add("selected");

        setTimeout(() => {
          // Clear the memory so it restarts completely fresh next time
          localStorage.clear();
          localStorage.setItem("appScreen", "app-closed"); // Keep it closed on refresh just in case

          document
            .getElementById("screen-rating")
            .classList.remove("active-screen");
          document.getElementById("map-bg").style.display = "none";
          document.getElementById("closed-state").style.display = "flex";
        }, 150);
      }
    </script>
  </body>
</html>
